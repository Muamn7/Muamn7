name: mechsim_core
description: >-
  The engine behind MechSim 2D: units, beam model, statics solver, internal
  force diagrams, validation, step-by-step explanations and practice problems.
  Pure Dart with no Flutter dependency, so it runs in the app, on the command
  line, or on any other device that can run Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  mechsim: mechsim

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
