org.gradle.daemon=true
org.gradle.jvmargs=-Xms512m -Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.configureondemand=false
org.gradle.parallel=true
org.gradle.caching=true

# Library versions
gdxVersion=1.14.2
# libGDX 1.14.2's Android backend depends on androidx.core 1.17.0, which
# declares a floor of AGP 8.9.1 and compileSdk 36. Both numbers below come from
# that requirement rather than from a preference for being current.
androidPluginVersion=8.9.1
gameVersion=0.1.6

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
