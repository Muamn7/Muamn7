name: Build APK

# The development sandbox cannot reach dl.google.com, so the Android SDK is
# unavailable there and the APK is built here instead. Every push produces a
# downloadable, installable debug APK under the run's Artifacts section.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a downloadable release with the APK'
        type: boolean
        default: false
      version:
        description: 'Version for that release, without the leading v'
        type: string
        default: '0.1.0'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle only includes the :android module when an SDK is present.
      - name: Point the build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug and release APKs
        run: ./gradlew :android:assembleDebug :android:assembleRelease --no-daemon

      # An APK that builds is not an APK that runs. These are the things whose
      # absence would install cleanly and then crash or render nothing on the
      # first frame, which is exactly the failure a build log cannot show.
      - name: Check the APKs contain what the game needs
        run: |
          set -euo pipefail
          fail=0
          for apk in android/build/outputs/apk/debug/*.apk \
                     android/build/outputs/apk/release/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            list=$(unzip -Z1 "$apk")

            check() {
              if echo "$list" | grep -q "$1"; then
                echo "   ok   $2"
              else
                echo "   MISSING  $2  ($1)"
                fail=1
              fi
            }

            # The renderer is nothing without its shaders, and the game reads
            # every weapon, enemy and item out of these JSON files at startup.
            check '^assets/shaders/retro.vert$'        'PS2 vertex shader'
            check '^assets/shaders/retro.frag$'        'PS2 fragment shader'
            check '^assets/data/weapons.json$'         'weapon table'
            check '^assets/data/enemies.json$'         'bestiary'
            check '^assets/data/bosses.json$'          'boss roster'
            check '^assets/data/items.json$'           'item table'
            check '^assets/data/npcs.json$'            'characters'
            # Without the font the whole interface is blank in Arabic.
            check 'assets/fonts/NotoNaskhArabic-Regular.ttf' 'Arabic font'
            # libGDX and FreeType natives, per ABI. A missing gdx-freetype .so
            # is the one that fails quietly: the game starts and every label
            # falls back to English.
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              check "^lib/$abi/libgdx.so$"          "libgdx.so ($abi)"
              check "^lib/$abi/libgdx-freetype.so$" "libgdx-freetype.so ($abi)"
            done
          done
          exit $fail

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-release-apk
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a software GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1

      # Builds every area and checks the world graph: no portal to a missing area,
      # no unreachable area, no boss arena with something of the level inside it.
      # It needs a GL context to build textures, so it cannot be a unit test.
      - name: Validate the world
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew :lwjgl3:run --no-daemon -Dashen.validateWorld=true

      # Runs the real game on llvmpipe with scripted input, so a crash in the
      # renderer, the level build or the movement code fails the build.
      - name: Run the game for 20 seconds
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew :lwjgl3:run --no-daemon \
              -Dashen.exitAfter=20 \
              -Dashen.autopilot=true \
              -Dashen.debug=true \
              -Dashen.screenshotAt=15 \
              -Dashen.screenshot=$PWD/screenshots/ci.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: screenshots/ci.png
          if-no-files-found: warn

  # Publishes the APK where someone can download it without a GitHub account
  # and without digging through the Actions tab - the artifacts there arrive as
  # a zip, which a phone cannot install.
  #
  # Runs for a v* tag, or from the Actions tab with "Publish" ticked. The second
  # route exists because pushing a tag is not always available to whoever is
  # doing the build.
  release:
    name: Publish release
    needs: [test, apk, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: ashen-*-apk
          path: apks
          merge-multiple: true

      - name: Name them after the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.1.0}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p out
          for apk in apks/*.apk; do
            case "$apk" in
              *release*) cp "$apk" "out/ashen-$version.apk" ;;
              *)         cp "$apk" "out/ashen-$version-debug.apk" ;;
            esac
          done
          ls -la out
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ASHEN v${{ env.VERSION }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## التثبيت

            نزّل `ashen-<version>.apk` وثبّته على هاتفك (أندرويد 7.0 فأحدث).
            سيطلب الهاتف السماح بالتثبيت من مصدر غير معروف — هذا طبيعي لأي
            ملف APK لا يأتي من متجر Play.

            اللعبة موقّعة بمفتاح تصحيح، فلا يمكن رفعها إلى Play بهذا الشكل،
            لكنها تُثبَّت وتُلعب كاملة.

            ## Install

            Download `ashen-<version>.apk` and install it (Android 7.0+). The
            phone will ask you to allow installation from an unknown source,
            which is normal for any APK that did not come from Play.

            Debug-signed, so it cannot be uploaded to Play as-is, but it
            installs and plays in full.
