name: Qareeb APK

# Builds the offline messenger in qareeb/. Like the game, it is built here
# because the development sandbox cannot reach the Android SDK. Every push that
# touches qareeb/ produces an installable APK under the run's Artifacts.

on:
  push:
    branches: ['**']
    tags: ['qareeb-v*']
    paths:
      - 'qareeb/**'
      - '.github/workflows/qareeb.yml'
  pull_request:
    paths:
      - 'qareeb/**'
      - '.github/workflows/qareeb.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a downloadable release with the APK'
        type: boolean
        default: false
      version:
        description: 'Version for that release, without the leading v'
        type: string
        default: '1.0.0'

permissions:
  contents: read

defaults:
  run:
    working-directory: qareeb

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default also asks for the long-retired 'tools' package,
      # which sdkmanager from cmdline-tools 16 refuses, failing the step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The networking runs real phones-worth of sockets on localhost: group
      # and private messages, receipts, relaying, catching up, discovery.
      - name: Network tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qareeb-test-report
          path: qareeb/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Point the build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      # The things whose absence installs fine and then does nothing: no
      # INTERNET means no sockets at all, no multicast permission means
      # friends never appear, no service type means a crash on Android 14.
      - name: Check the APK
        run: |
          set -euo pipefail
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          fail=0
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            for want in android.permission.INTERNET \
                        android.permission.CHANGE_WIFI_MULTICAST_STATE \
                        android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE \
                        com.muamn.qareeb.ChatService \
                        com.muamn.qareeb.ChatActivity; do
              if echo "$manifest" | grep -q "$want"; then
                echo "   ok       $want"
              else
                echo "   MISSING  $want"; fail=1
              fi
            done
            if unzip -Z1 "$apk" | grep -q '^classes.*\.dex$'; then
              echo "   ok       dex"
            else
              echo "   MISSING  dex"; fail=1
            fi
          done
          exit $fail

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qareeb-debug-apk
          path: qareeb/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: qareeb-release-apk
          path: qareeb/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # A zip from the Actions tab cannot be installed on a phone; a release asset can.
  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/qareeb-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fetch the APK
        uses: actions/download-artifact@v4
        with:
          name: qareeb-release-apk
          path: apks

      - name: Name it after the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/qareeb-v* ]]; then
            version="${GITHUB_REF_NAME#qareeb-v}"
          else
            version="${INPUT_VERSION:-1.0.0}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p out
          cp apks/*.apk "out/qareeb-$version.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qareeb-v${{ env.VERSION }}
          name: قريب v${{ env.VERSION }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            ## قريب — مراسلة بين الأصدقاء بدون إنترنت

            نزّل `qareeb-<version>.apk` وثبّته على كل هاتف (أندرويد 8.0 فأحدث).
            سيطلب الهاتف السماح بالتثبيت من مصدر غير معروف — هذا طبيعي لأي
            ملف APK لا يأتي من متجر Play.

            **الاستخدام:** شخص واحد يفتح نقطة الاتصال (Hotspot)، والباقون
            يتصلون بها من إعدادات Wi-Fi، ثم يفتح الجميع التطبيق.
